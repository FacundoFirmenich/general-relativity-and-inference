;background:repeating-linear-gradient(0deg,transparent 0 58px,#6c81a51a 59px 60px),repeating-linear-gradient(90deg,transparent 0 88px,#6c81a51a 89px 90px);transform:translate(var(--px,0px),var(--py,0px)) perspective(520px) rotateX(57deg) scale(3);transform-origin:50% 70%;opacity:.38}.stage:after{content:"";position:absolute;inset:15%;border:1px solid #7386aa0c;border-radius:40px;box-shadow:0 0 0 35px #7386aa04,0 0 0 90px #7386aa03;pointer-events:none;transform:translate(var(--px,0px),var(--py,0px));z-index:0}.stage.flat:before,.stage.flat:after{display:none}.stage svg{z-index:1}.canvas-actions,.stage-status{z-index:2}.touring #camera{transition:transform .55s ease}.stage.flat{background:#fafbfe}.stage svg{width:100%;height:100%;position:relative;touch-action:none;user-select:none}.node{cursor:grab;outline:none}.node:focus .card{stroke-width:3}.node:hover .card{filter:url(#lift)}.node .card{fill:white;stroke:#ced5e4;stroke-width:1.2;filter:url(#shadow)}.node.selected .card{stroke:#73558c;stroke-width:2.8;filter:url(#lift)}.node .label{font-size:16px;font-weight:650;fill:#27344a}.node .kind{font-size:10px;letter-spacing:.6px;fill:#677286}.node .formula{font-size:11px;fill:#4e5770}.node .badge{font-size:10px;font-weight:700}.edge{fill:none;stroke:#94a1b9;stroke-width:1.5;opacity:.55;transition:opacity .2s}.edge.boundary{stroke-dasharray:5 5;stroke:#92769c}.edge.hit{stroke:transparent;stroke-width:16;cursor:pointer;opacity:1}.edge.selected{stroke:#73558c;stroke-width:3;opacity:1}.edge-text{font-size:10px;fill:#546681}.dim{opacity:.16}.column{font-size:12px;font-weight:700;fill:#485771;letter-spacing:.8px}.row-label{font-size:10px;letter-spacing:1px;fill:#71819a}.canvas-label{position:absolute;left:16px;top:14px;z-index:1;font-size:11px;color:var(--muted);pointer-events:none}.canvas-actions{position:absolute;right:12px;bottom:12px;display:flex;gap:5px}.canvas-actions button{box-shadow:0 3px 10px #303c4f0c}.stage-status{position:absolute;bottom:13px;left:16px;font-size:11px;color:var(--muted);max-width:65%}.inspector{background:white;border:1px solid var(--line);border-radius:14px;padding:22px;overflow:auto;height:calc(100vh - 225px);min-height:540px;box-shadow:0 8px 30px #28354b05}.inspector h2{font:600 22px/1.2 Georgia,serif;margin:8px 0 16px}.inspector h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin:24px 0 9px;color:var(--violet)}.inspector p{font-size:13px}.formula-box{font-family:Georgia,serif;font-size:16px;background:#f2f4fa;padding:14px;border-radius:8px;overflow-wrap:anywhere}.pill{display:inline-block;font-size:10px;letter-spacing:.07em;padding:3px 7px;border-radius:5px;background:#f0ecf5;color:#6d4f83}.limit{border-left:3px solid #9778a3;padding-left:12px;color:#665471;font-size:12px}.artifact{border-top:1px solid #e4e7ee;padding:10px 0;font-size:11px;overflow-wrap:anywhere}.artifact code{color:#777e90;font-size:10px}.artifact button{font-size:11px;margin-top:6px}.metric{font:12px ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--muted)}.legend span:before{content:'◇';margin-right:4px;color:var(--c)}.tour{display:none;margin:0 20px 18px;padding:20px 25px;background:linear-gradient(110deg,#eeedf6,#fafbfd 65%,#e9f3f6);border:1px solid #d2d8e6;border-radius:14px;grid-template-columns:220px 1fr auto;gap:22px;align-items:center}.tour.open{display:grid}.tour h2{font:600 21px/1.2 Georgia,serif;margin:5px 0}.tour p{margin:0;font-size:14px;max-width:850px}.tour-controls{display:flex;flex-direction:column;gap:6px}.progress{height:3px;background:#d8d9e7;margin-top:12px;border-radius:3px;overflow:hidden}.progress div{height:100%;background:#795a90;width:0;transition:width .15s}.touring .stage,.touring .inspector{height:calc(100vh - 420px);min-height:365px}footer{padding:0 28px 18px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:20px}a{color:#526b92}body.wide main{grid-template-columns:1fr}b <header><div><div class="eyebrow">GRAVITAS · EPISTEMIC ATLAS</div><h1 id="title"></h1><p id="subtitle"></p></div><div class="header-actions"><select id="language" aria-label="Idioma / Language"><option value="es">Castellano</option><option value="en">English</option></select><button id="help"></button><button id="export"></button></div></header>

<script>
'use strict';
const G=JSON.parse(document.getElementById('model').textContent),$=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
let lang='__LANG__',route='all',selected=null,selectedEdge=null,touring=false,playing=false,tourIndex=0,elapsed=0,lastTick=0,depth=true,positions={},visible=[],view={x:0,y:0,k:1};
const palette={analytic:'#496285',numerical:'#2d7f92',conditional:'#74578c',unresolved:'#945b8d',boundary:'#7e8493'},states={analytic:['Identidad / demostración','Identity / proof'],numerical:['Comprobación numérica','Numerical check'],conditional:['Condicional al modelo','Model-conditional'],unresolved:['Discrepancia abierta','Unresolved discrepancy'],boundary:['Límite de alcance','Scope boundary']};
const T=(es,en)=>lang==='es'?es:en,B=o=>o[lang],esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const el=(tag,attrs={},parent)=>{let n=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,v);if(parent)parent.append(n);return n};
function toast(s){$('notice').textContent=s;$('notice').style.display='block';setTimeout(()=>$('notice').style.display='none',2200)}
function download(text,name,type='application/json'){let u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)}
function lines(s,max=25){let a=[''];for(let word of s.split(' ')){let k=a.length-1;if(a[k]&&a[k].length+word.length+1>max)a.push(word);else a[k]+=(a[k]?' ':'')+word}return a}
function texts(){document.documentElement.lang=lang;document.title=B(G.title)+' · GRAVITAS';$('language').value=lang;$('title').textContent=B(G.title);$('subtitle').textContent=B(G.subtitle);$('help').textContent=T('Cómo leerlo','Reading guide');$('export').textContent=T('Exportar','Export');$('tourStart').textContent=T('Tour guiado','Guided tour');$('play').textContent=playing?T('Ⅱ Pausar','Ⅱ Pause'):T('▷ Play','▷ Play');$('search').placeholder=T('Buscar afirmación…','Find a claim…');$('search').ariaLabel=T('Buscar afirmaciones','Search claims');$('canvasLabel').textContent=T('ARRASTRÁ EL LIENZO O CADA CAJA · RUEDA PARA ZOOM','DRAG CANVAS OR ANY CARD · SCROLL TO ZOOM');$('fit').textContent=T('Encuadrar','Fit');$('reset').textContent=T('Ordenar','Reset layout');$('depth').textContent=T('Profundidad','Depth');$('depth').classList.toggle('active',depth);$('footerText').textContent=T('Dependencias argumentales, no causalidad estimada. Diseño de referencia: KwanTube / Beyond Redfield.','Argumentative dependencies, not estimated causation. Design reference: KwanTube / Beyond Redfield.');$('durationLabel').textContent=T('por bloque','per block');$('closeTour').ariaLabel=T('Cerrar tour','Close tour');$('prev').ariaLabel=T('Bloque anterior','Previous block');$('next').ariaLabel=T('Bloque siguiente','Next block');let old=$('state').value;$('state').innerHTML='<option value="all">'+T('Todos los estados','All states')+'</option>'+Object.entries(states).map(([k,v])=>`<option value="${k}">${v[lang==='es'?0:1]}</option>`).join('');$('state').value=old||'all';renderRoutes();render();inspect();if(touring)tourText()}
function renderRoutes(){$('routes').innerHTML=['all',...Object.keys(G.routes)].map(k=>`<button data-route="${k}" class="${route===k?'active':''}">${k==='all'?T('Mapa completo','Full map'):B(G.routes[k])}</button>`).join('');$('routes').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(touring)stopTour();route=b.dataset.route;selected=null;selectedEdge=null;renderRoutes();render();fit();inspect()})}
function point(n){if(positions[n.id])return positions[n.id];let rows=route==='all'?Object.keys(G.routes):[route];return{x:42+n.column*234,y:83+rows.indexOf(n.route)*137}}
function connected(){let set=new Set();if(selected){set.add(selected);G.edges.filter(e=>e.source===selected||e.target===selected).forEach(e=>{set.add(e.source);set.add(e.target)})}if(selectedEdge){let e=G.edges.find(e=>e.id===selectedEdge);if(e){set.add(e.source);set.add(e.target)}}return set}
function render(){const root=$('drawing');root.replaceChildren();let q=$('search').value.toLowerCase(),state=$('state').value;visible=G.nodes.filter(n=>(route==='all'||n.route===route)&&(state==='all'||n.status===state)&&(!q||(B(n.title)+' '+B(n.summary)+' '+B(n.formula)).toLowerCase().includes(q)));let ids=new Set(visible.map(n=>n.id)),near=connected();let rows=route==='all'?Object.keys(G.routes):[route];G.columns.forEach((c,k)=>{let t=el('text',{x:42+k*234,y:32,class:'column'},root);t.textContent=`0${k+1}  ${B(c).toUpperCase()}`});for(let[r,k]of rows.map((v,k)=>[v,k])){let t=el('text',{x:42,y:66+k*137,class:'row-label'},root);t.textContent=B(G.routes[r]).toUpperCase()}
 for(let e of G.edges){if(!ids.has(e.source)||!ids.has(e.target))continue;let a=point(G.nodes.find(n=>n.id===e.source)),b=point(G.nodes.find(n=>n.id===e.target));let x1=a.x+208,y1=a.y+49,x2=b.x,y2=b.y+49;let d=`M ${x1} ${y1} C ${x1+34} ${y1}, ${x2-34} ${y2}, ${x2} ${y2}`;let active=e.id===selectedEdge||e.source===selected||e.target===selected;el('path',{d,class:`edge ${e.boundary?'boundary':''} ${active?'selected':''} ${near.size&&!active?'dim':''}`,'marker-end':'url(#arrow)'},root);let hit=el('path',{d,class:'edge hit','data-edge':e.id,tabindex:0,role:'button','aria-label':B(e.relation)},root);hit.onclick=ev=>{ev.stopPropagation();selectedEdge=e.id;selected=null;render();inspect()};hit.onkeydown=ev=>{if(ev.key==='Enter')hit.onclick(ev)};let title=el('title',{},hit);title.textContent=B(e.relation)}
 for(let n of visible){let p=point(n),g=el('g',{transform:`translate(${p.x} ${p.y})`,class:`node ${n.id===selected?'selected':''} ${near.size&&!near.has(n.id)?'dim':''}`,tabindex:0,role:'button','aria-label':B(n.title),'data-id':n.id},root);el('rect',{width:208,height:104,rx:11,class:'card'},g);el('rect',{x:0,y:15,width:3,height:74,rx:2,fill:palette[n.status]},g);let k=el('text',{x:14,y:20,class:'kind'},g);k.textContent=B(n.evidence_class);let badge=el('text',{x:194,y:20,'text-anchor':'end',class:'badge',fill:palette[n.status]},g);badge.textContent={analytic:'◇',numerical:'✓',conditional:'◈',unresolved:'!',boundary:'→'}[n.status];lines(B(n.title),22).slice(0,2).forEach((s,j)=>{let t=el('text',{x:14,y:44+j*19,class:'label'},g);t.textContent=s});let f=el('text',{x:14,y:88,class:'formula'},g);let formula=B(n.formula);let short=formula.length>32?formula.slice(0,30)+'…':formula;f.textContent=short;let title=el('title',{},g);title.textContent=B(n.summary)+'\n'+B(n.formula);g.onpointerdown=ev=>startDrag(ev,n);g.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();select(n.id)}}}
 if(!visible.length){let t=el('text',{x:80,y:150,class:'empty'},root);t.textContent=T('No hay coincidencias.','No matches.')}applyView();$('status').textContent=`${visible.length} / ${G.nodes.length} ${T('nodos','nodes')} · ${G.edges.filter(e=>ids.has(e.source)&&ids.has(e.target)).length} ${T('relaciones','relations')} · SHA ${G.content_sha256.slice(0,12)}`}
function applyView(){$('camera').setAttribute('transform',`translate(${view.x} ${view.y}) scale(${view.k})`)}
function fit(){let w=$('svg').clientWidth,h=$('svg').clientHeight;let xmax=1450,ymax=route==='all'?923:245;for(let n of visible){let p=point(n);xmax=Math.max(xmax,p.x+230);ymax=Math.max(ymax,p.y+132)}view.k=Math.min((w-24)/xmax,(h-55)/ymax,1.5);view.x=(w-xmax*view.k)/2;view.y=(h-ymax*view.k)/2;applyView()}
function zoom(factor,cx=$('svg').clientWidth/2,cy=$('svg').clientHeight/2){let k=Math.max(.22,Math.min(3,view.k*factor)),r=k/view.k;view.x=cx-(cx-view.x)*r;view.y=cy-(cy-view.y)*r;view.k=k;applyView()}
let drag=null;
function startDrag(e,n){if(e.button!==0)return;e.stopPropagation();let p=point(n);drag={id:n.id,sx:e.clientX,sy:e.clientY,x:p.x,y:p.y,moved:false};$('svg').setPointerCapture(e.pointerId)}
$('svg').onpointerdown=e=>{if(e.button!==0||e.target.closest('.node')||e.target.classList.contains('hit'))return;drag={id:null,sx:e.clientX,sy:e.clientY,x:view.x,y:view.y,moved:false};$('svg').setPointerCapture(e.pointerId)};
$('svg').onpointermove=e=>{if(!drag)return;let dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(Math.abs(dx)+Math.abs(dy)>5)drag.moved=true;if(drag.id){positions[drag.id]={x:drag.x+dx/view.k,y:drag.y+dy/view.k};render()}else{view.x=drag.x+dx;view.y=drag.y+dy;applyView()}};
$('svg').onpointerup=e=>{if(!drag)return;let d=drag;drag=null;if(!d.moved&&d.id)select(d.id);else if(!d.moved){selected=null;selectedEdge=null;render();inspect()}if($('svg').hasPointerCapture(e.pointerId))$('svg').releasePointerCapture(e.pointerId)};
$('svg').onpointercancel=()=>{drag=null};$('svg').addEventListener('wheel',e=>{e.preventDefault();let r=$('svg').getBoundingClientRect();zoom(Math.exp(-e.deltaY*.001),e.clientX-r.left,e.clientY-r.top)},{passive:false});
function select(id){selected=id;selectedEdge=null;render();inspect();try{history.replaceState(null,'','#'+id)}catch(_){}}
function inspect(){let n=G.nodes.find(x=>x.id===selected),e=G.edges.find(x=>x.id===selectedEdge);if(e){$('inspector').innerHTML=`<div class="eyebrow">${T('RELACIÓN ARGUMENTAL','ARGUMENTATIVE RELATION')}</div><h2>${esc(B(e.relation))}</h2><p>${esc(B(e.summary))}</p><h3>${T('Desde / hacia','From / to')}</h3><p>${esc(B(G.nodes.find(n=>n.id===e.source).title))} → ${esc(B(G.nodes.find(n=>n.id===e.target).title))}</p>`;return}if(!n){$('inspector').innerHTML=`<div class="eyebrow">${T('UNA INVESTIGACIÓN, SEIS RUTAS','ONE INVESTIGATION, SIX ROUTES')}</div><h2>${T('De la afirmación<br>a la evidencia.','From a claim<br>to its evidence.')}</h2><p>${T('Cada caja tiene un papel: supuesto, operador, resultado, comprobación, inferencia o límite. Seleccionala para abrir su explicación y sus archivos.','Each card has a role: assumption, operator, result, check, inference or boundary. Select it to open its explanation and files.')}</p><div class="formula-box">${T('Modelo → datos → ley conjunta<br>→ comprobación → alcance','Model → data → joint law<br>→ check → scope')}</div><h3>${T('Estados, no puntuaciones','States, not scores')}</h3><div class="legend">${Object.entries(states).map(([k,v])=>`<span style="--c:${palette[k]}">${v[lang==='es'?0:1]}</span>`).join('')}</div><h3>${T('Cómo explorar','How to explore')}</h3><p>${T('Mové cada caja, arrastrá el fondo y acercá con la rueda. El tour ofrece una explicación por bloque. Play avanza automáticamente; podés pausar en cualquier momento.','Move any card, drag the background and zoom with the wheel. The tour explains one block at a time. Play advances automatically; pause at any time.')}</p><p class="limit">${T('La profundidad es visual. Ningún eje representa probabilidad, causalidad o una dimensión física.','Depth is visual. No axis represents probability, causality or a physical dimension.')}</p>`;return}
$('inspector').innerHTML=`<div class="eyebrow">${esc(B(G.routes[n.route]))}</div><h2>${esc(B(n.title))}</h2><span class="pill">${states[n.status][lang==='es'?0:1]} · ${esc(B(n.evidence_class))}</span><p>${esc(B(n.summary))}</p><div class="formula-box">${esc(B(n.formula))}</div><h3>${T('Límite de la afirmación','Claim boundary')}</h3><p class="limit">${esc(B(n.limits))}</p>${Object.keys(n.metrics).length?`<h3>${T('Valores del registro','Recorded values')}</h3><pre class="metric">${esc(JSON.stringify(n.metrics,null,2))}</pre>`:''}<h3>${T('Evidencia descargable','Downloadable evidence')}</h3>${n.artifacts.map((p,k)=>{let a=G.artifacts[p];return `<div class="artifact">${esc(p)}<br><code>SHA-256 ${a.sha256}</code><br><button data-artifact="${k}">${T('Descargar fuente','Download source')} · ${a.bytes.toLocaleString(lang)} B</button></div>`}).join('')}<h3>${T('Conexiones','Connections')}</h3>${G.edges.filter(e=>e.source===n.id||e.target===n.id).map(e=>{let other=G.nodes.find(x=>x.id===(e.source===n.id?e.target:e.source));return `<p><button data-node="${other.id}">${esc(B(other.title))} →</button></p>`}).join('')}`;
$('inspector').querySelectorAll('[data-artifact]').forEach(b=>b.onclick=()=>{let path=n.artifacts[+b.dataset.artifact];download(G.artifacts[path].text,path.split('/').pop(),'text/plain;charset=utf-8')});$('inspector').querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{let dest=G.nodes.find(n=>n.id===b.dataset.node);if(route!=='all'&&route!==dest.route){route=dest.route;renderRoutes();render();fit()}select(dest.id)})}
function tourText(){let s=G.tour[tourIndex];$('step').textContent=T('RECORRIDO','GUIDED PATH')+` · ${tourIndex+1} / ${G.tour.length}`;$('tourTitle').textContent=B(s.title);$('tourBody').textContent=B(s.body);$('pause').textContent=playing?T('Ⅱ Pausar','Ⅱ Pause'):T('▷ Continuar','▷ Continue');$('play').textContent=playing?T('Ⅱ Pausar','Ⅱ Pause'):'▷ Play';$('prev').disabled=tourIndex===0;$('next').disabled=tourIndex===G.tour.length-1;}
function startTour(auto=false){touring=true;playing=auto;elapsed=0;$('tour').classList.add('open');document.body.classList.add('touring');$('search').value='';$('state').value='all';showStep(tourIndex)}
function showStep(idx){tourIndex=Math.max(0,Math.min(G.tour.length-1,idx));elapsed=0;route=G.tour[tourIndex].route;positions={};selected=G.tour[tourIndex].focus;selectedEdge=null;renderRoutes();render();fit();inspect();tourText();$('progress').style.width='0%'}
function stopTour(){touring=false;playing=false;elapsed=0;$('tour').classList.remove('open');document.body.classList.remove('touring');$('play').textContent='▷ Play';fit()}
function tick(now){let dt=lastTick?Math.min(now-lastTick,250):0;lastTick=now;if(touring&&playing&&!document.hidden){elapsed+=dt;let total=+$('duration').value;$('progress').style.width=Math.min(100,100*elapsed/total)+'%';if(elapsed>=total){if(tourIndex<G.tour.length-1)showStep(tourIndex+1);else{playing=false;tourText();toast(T('Recorrido completo. Podés volver a cualquier bloque.','Tour complete. Revisit any block.'))}}}requestAnimationFrame(tick)}
$('tourStart').onclick=()=>{tourIndex=0;startTour(false)};$('play').onclick=()=>{if(!touring){tourIndex=0;startTour(true)}else{playing=!playing;tourText()}};$('pause').onclick=()=>{playing=!playing;tourText()};$('prev').onclick=()=>showStep(tourIndex-1);$('next').onclick=()=>showStep(tourIndex+1);$('closeTour').onclick=stopTour;$('plus').onclick=()=>zoom(1.2);$('minus').onclick=()=>zoom(1/1.2);$('fit').onclick=fit;$('reset').onclick=()=>{positions={};render();fit()};$('depth').onclick=()=>{depth=!depth;$('stage').classList.toggle('flat',!depth);$('depth').classList.toggle('active',depth)};$('wide').onclick=()=>{document.body.classList.toggle('wide');fit()};$('search').oninput=()=>{render();fit()};$('state').onchange=()=>{render();fit()};$('language').onchange=()=>{lang=$('language').value;texts();fit()};
function modal(html){$('modalContent').innerHTML=`<button id="closeModal" style="float:right">×</button>${html}`;$('modal').classList.add('open');$('closeModal').onclick=()=>$('modal').classList.remove('open');$('closeModal').focus()}
$('help').onclick=()=>modal(`<div class="eyebrow">GRAVITAS / ${T('LECTURA','READING')}</div><h2>${T('Qué puede decir este grafo','What this graph can tell you')}</h2><p>${T('Las seis columnas ordenan el argumento. Las filas son dominios de análisis, no niveles de superioridad. Las flechas expresan dependencias y condiciones de interpretación, no relaciones causales medidas.','The six columns organize the argument. Rows are analysis domains, not levels of superiority. Arrows express dependencies and conditions of interpretation, not measured causal relations.')}</p><p>${T('L1: identidad o demostración bajo supuestos. L2: inferencia condicionada al modelo. L3: comprobación computacional. Una validación externa L4 no se obtiene por ejecutar más simulaciones.','L1: identity or proof under assumptions. L2: model-conditional inference. L3: computational check. External L4 validation does not follow from running more simulations.')}</p><p>${T('Enter abre una caja enfocada. Escape cierra el tour o el diálogo. Espacio pausa o reanuda el tour. El tiempo se detiene al ocultar la pestaña. «Ordenar» restaura las posiciones.','Enter opens a focused card. Escape closes the tour or dialog. Space pauses or resumes the tour. Time pauses when the tab is hidden. “Reset layout” restores positions.')}</p><p>${T('Los archivos de evidencia están incluidos: el HTML funciona sin conexión. Los enlaces externos requieren Internet. Los hashes identifican contenidos; no certifican una conclusión física.','Evidence files are embedded: the HTML works offline. External links require the Internet. Hashes identify content; they do not certify a physical conclusion.')}</p><p>${T('Modelo de navegación y trazabilidad:','Navigation and traceability model:')} <a href="${G.reference}" target="_blank" rel="noopener">KwanTube / Beyond Redfield</a>.</p>`);
$('export').onclick=()=>{modal(`<h2>${T('Exportar la investigación visible','Export the visible investigation')}</h2><p>${T('El JSON contiene el grafo y sus fuentes. SVG exporta la vista; las posiciones se guardan aparte.','JSON contains the graph and its sources. SVG exports the view; positions are saved separately.')}</p><button id="jsonExport">JSON</button> <button id="svgExport">SVG</button> <button id="layoutExport">${T('Posiciones','Positions')}</button>`);$('jsonExport').onclick=()=>download(JSON.stringify(G,null,2),'gravitas_epistemic_graph.json');$('layoutExport').onclick=()=>download(JSON.stringify({positions,view,route,lang},null,2),'gravitas_graph_layout.json');$('svgExport').onclick=()=>{let svg=$('svg').cloneNode(true);svg.setAttribute('xmlns',NS);svg.setAttribute('width',$('svg').clientWidth);svg.setAttribute('height',$('svg').clientHeight);let style=el('style');style.textContent=document.querySelector('style').textContent;svg.prepend(style);download(new XMLSerializer().serializeToString(svg),'gravitas_graph_'+lang+'.svg','image/svg+xml')}};
$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('modal').classList.remove('open');if(touring)stopTour()}if(e.code==='Space'&&touring&&!['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();playing=!playing;tourText()}});
$ ('stage').addEventListener('pointermove',e=>{if(!depth||drag||matchMedia('(prefers-reduced-motion: reduce)').matches)return;let r=$('stage').getBoundingClientRect();$('stage').style.setProperty('--px',((e.clientX-r.left)/r.width-.5)*18+'px');$('stage').style.setProperty('--py',((e.clientY-r.top)/r.height-.5)*10+'px')});
new ResizeObserver(()=>fit()).observe($('stage'));texts();fit();if(location.hash){let id=decodeURIComponent(location.hash.slice(1));if(G.nodes.some(n=>n.id===id))select(id)}requestAnimationFrame(tick);
</script></body></html>
