name: Numerical reproduction / Reproduccion numerica
on: [push, workflow_dispatch]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-ui.txt
      - run: python tools/check_publication_boundary.py
      - run: python run.py all
      - uses: actions/upload-artifact@v4
        with:
          name: computational-records
          path: records/
